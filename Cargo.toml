[package]
name = "mcp-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.154"
bytes = "=1.12.2"
getrandom = "=0.3.4"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "http1", "server"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std", "thread"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }

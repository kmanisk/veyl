[package]
name = "mcp-gateway"
version = "0.2.1-alpha"
edition = "2024"
default-run = "mcp-gateway"

[features]
test-hooks = []

[dependencies]
serde_json = "=1.0.154"
bytes = "=1.12.2"
getrandom = "=0.3.4"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "http1", "server"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["event", "fs", "param", "process", "std", "thread"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
